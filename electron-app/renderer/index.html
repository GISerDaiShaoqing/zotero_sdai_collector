<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <link rel="stylesheet" href="style.css" />
  <title>zotero_sdai_collector</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div>
        <div class="title">zotero_sdai_collector</div>
        <div class="subtitle" id="subtitle">正在启动…</div>
      </div>
    </div>
    <div class="head-chips" id="headChips"></div>
    <button class="icon-btn" id="aboutBtn" title="关于">ⓘ</button>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
  </header>

  <div class="toolbar">
    <button class="btn ghost" id="pauseBtn">暂停监听</button>
    <button class="btn ghost" id="reconfirmBtn">重弹待确认</button>
    <button class="btn ghost" id="clearBtn">清空显示</button>
    <span class="hint">日常用法：在微信里复制公众号文章链接，其余全自动</span>
  </div>

  <main class="list" id="list"></main>

  <div class="modal-mask hidden" id="settingsMask">
    <div class="modal">
      <div class="modal-head">
        <span>设置</span>
        <button class="icon-btn" id="settingsClose">✕</button>
      </div>

      <div class="section">
        <div class="section-title">LLM 分类（OpenAI 兼容接口）</div>
        <label class="field"><span>接口地址</span><input id="cfgBaseUrl" placeholder="https://api.deepseek.com" /></label>
        <label class="field"><span>API Key</span><input id="cfgKey" type="password" placeholder="本地 Ollama 可留空" /></label>
        <label class="field"><span>模型</span><input id="cfgModel" placeholder="deepseek-flash" /></label>
        <label class="field"><span>分类阈值（低于则弹确认）</span><input id="cfgThreshold" type="number" min="0.3" max="0.95" step="0.05" /></label>
      </div>

      <div class="section">
        <div class="section-title">飞书机器人（手机端入口）</div>
        <label class="field"><span>App ID</span><input id="cfgFeishuId" placeholder="cli_…" /></label>
        <label class="field"><span>App Secret</span><input id="cfgFeishuSecret" type="password" placeholder="开放平台获取" /></label>
      </div>

      <div class="section">
        <div class="section-title">写入策略</div>
        <div class="check-row"><label><input type="checkbox" id="cfgAutoWrite" /> 高置信度自动写入（关闭则每条弹确认卡片）</label></div>
        <div class="check-row"><label><input type="checkbox" id="cfgFollowSel" /> 跟随 Zotero 当前选中集合（停在某集合时直接存入，5 分钟内有效）</label></div>
      </div>

      <div class="section">
        <div class="section-title">外观</div>
        <div class="kv"><span>卡片窗背景图</span><span id="bgName">未设置</span></div>
        <div class="row-btns">
          <button class="btn ghost" id="pickBgBtn">选择图片…</button>
          <button class="btn ghost" id="clearBgBtn">清除背景</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Zotero</div>
        <div class="kv"><span>集合树</span><span id="zotCount">—</span></div>
        <div class="kv"><span>写入授权</span><span id="zotAuth">—</span></div>
        <div class="row-btns">
          <button class="btn ghost" id="refreshTreeBtn">刷新集合树</button>
          <button class="btn ghost" id="authorizeBtn">重新授权</button>
        </div>
      </div>

      <div class="modal-foot">
        <span class="note">保存后立即生效，无需重启</span>
        <button class="btn primary" id="saveCfgBtn">保存设置</button>
      </div>
    </div>
  </div>

  <div class="modal-mask hidden" id="aboutMask">
    <div class="modal">
      <div class="modal-head">
        <span>关于</span>
        <button class="icon-btn" id="aboutClose">✕</button>
      </div>
      <div class="about-body">
        <div class="about-name">zotero_sdai_collector <span class="ver" id="aboutVersion">—</span></div>
        <div class="about-sub">微信公众号推送 · 论文直链 → 智能分类 → Zotero</div>
        <div class="about-author">作者：戴劭勍（Shaoqing Dai）· 武汉大学 资源与环境科学学院</div>
        <div class="about-links">
          <a href="#" data-url="https://gisersqdai.top/mycv/">个人主页</a> ·
          <a href="#" data-url="https://github.com/GISerDaiShaoqing/zotero_sdai_collector">GitHub 仓库</a> ·
          <a href="#" data-url="https://github.com/GISerDaiShaoqing/zotero_sdai_collector/blob/main/CHANGELOG.md">更新日志</a>
        </div>
        <div class="about-license">MIT License · 仅供个人学习与研究使用</div>
        <div class="update-row">
          <button class="btn ghost" id="checkUpdateBtn">检查更新</button>
          <span class="update-result" id="updateResult"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="ui.js"></script>
</body>
</html>
